services:
  - type: web
    name: prajakeeyam-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        sync: false   # 'staging' while testing without Google OAuth, then 'production'
      - key: DEV_FAKE_AUTH
        sync: false   # '1' only while ENV=staging; leave empty in production
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: ADMIN_EMAILS
        sync: false
