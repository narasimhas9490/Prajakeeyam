services:
  - type: web
    name: prajakeeyam-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: prajakeeyam-4421a
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: ADMIN_EMAILS
        sync: false
